<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Snívať</title>
<style>
  :root { --bg:#121212; --ink:#f5f5f5; --muted:#9a9a9a; }
  html.light { --bg:#f6f3ee; --ink:#1a2620; --muted:#5c6b62; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-inter), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    text-align: center;
  }
  .mark {
    width: 72px; height: 72px; border-radius: 50%;
    background: #2f9e6b; position: relative; margin: 0 auto 28px;
  }
  .mark::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 30px; height: 30px; border-radius: 50%; background: #fff;
  }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  p { margin-top: 10px; font-size: 15px; line-height: 1.5; color: var(--muted); max-width: 320px; }
  button {
    margin-top: 24px; border: 0; border-radius: 9999px;
    background: #2f9e6b; color: #fff; font-weight: 700; font-size: 15px;
    padding: 12px 28px; cursor: pointer;
  }
  button:hover { background: #34b577; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>You're offline</h1>
  <p>Snívať needs a connection to load your feed. Check your network and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>
(function () {
  try {
    if (localStorage.getItem("theme") === "light") {
      document.documentElement.classList.add("light");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
